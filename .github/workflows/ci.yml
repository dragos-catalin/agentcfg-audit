name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "23 3 * * 1" # weekly full-history secret scan + fresh CVE data
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    uses: dragos-catalin/workflows/.github/workflows/node-ci.yml@v1
    with:
      tasks: lint typecheck test build
      extra: node dist/cli.mjs --help && node dist/cli.mjs scan . --fail-on medium && pnpm audit --audit-level high
  extension:
    # The reusable workflow checks out the whole repo, so extension/src can import ../../src.
    uses: dragos-catalin/workflows/.github/workflows/node-ci.yml@v1
    with:
      working-directory: extension
      tasks: lint typecheck test build
      extra: pnpm run package && pnpm audit --audit-level high
  security:
    uses: dragos-catalin/workflows/.github/workflows/security.yml@v1
    with:
      full-history: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
